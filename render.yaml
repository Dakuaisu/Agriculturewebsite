services:
  - type: web
    name: agriapp-api
    runtime: python
    plan: free
    rootDir: Backend
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.14
      - key: ALLOWED_ORIGINS
        value: https://dakuaisu.github.io
