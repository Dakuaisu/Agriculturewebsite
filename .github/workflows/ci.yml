name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  training:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: training
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: training/requirements.txt
      - run: pip install -r requirements.txt
      - run: ruff check .
      - run: python train.py
      - name: Retrain check (report and input ranges unchanged)
        run: git diff --exit-code -- evaluation.md feature_ranges.json
      - name: Export check (model.json and sklearn predictions unchanged)
        run: git diff --exit-code -- model.json sklearn_predictions.json

  frontend:
    needs: training
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: AgricultureApp
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: AgricultureApp/package-lock.json
      - run: npm ci
      - run: npm run lint
      - name: JS parity test (browser prediction == sklearn on every row)
        run: npx vitest run src/predict.test.js
      - run: npm test
      - run: npm run build
