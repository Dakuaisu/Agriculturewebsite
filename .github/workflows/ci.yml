name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  training:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: training
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: training/requirements.txt
      - run: pip install -r requirements.txt
      - run: ruff check .
      - name: Retraining reproduces the committed model report
        run: |
          python train.py
          git diff --exit-code -- evaluation.md feature_ranges.json

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: AgricultureApp
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: AgricultureApp/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
